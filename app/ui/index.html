<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>photo-cat</title>
  </head>
  <body>
    <div id="root">
      <main
        id="splash"
        style="
          background: #1b1b1c;
          color: #e8e8ea;
          min-height: 100vh;
          display: grid;
          place-content: center;
          font: 18px system-ui;
        "
      >
        <h1>photo-cat</h1>
        <p role="status">Apertura… / Opening…</p>
      </main>
    </div>
    <script>
      // Schermata statica nel tema salvato (o in quello del sistema).
      (function () {
        var theme;
        try {
          var saved = JSON.parse(localStorage.getItem("photo-cat.layout") || "null");
          theme = saved && saved.state && saved.state.theme;
        } catch (e) {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (theme === "light") {
          var el = document.getElementById("splash");
          el.style.background = "#f4f4f5";
          el.style.color = "#1b1b1c";
        }
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
