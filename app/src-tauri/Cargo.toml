[package]
name = "photo-cat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "photo-cat: catalogazione locale di fotografie"

[features]
default = ["heif"]
heif = ["pc-ingest/heif"]

[lib]
name = "photo_cat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pc-core = { workspace = true, features = ["specta"] }
pc-diag = { workspace = true, features = ["specta"] }
pc-store = { workspace = true, features = ["specta"] }
pc-governor = { workspace = true, features = ["specta"] }
pc-jobs = { workspace = true, features = ["specta"] }
pc-ingest.workspace = true
pc-models = { workspace = true, features = ["specta"] }
pc-ai = { workspace = true, features = ["specta"] }
pc-organize = { workspace = true, features = ["specta"] }
tauri-plugin-dialog = "2"
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
specta.workspace = true
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# Stesse versioni usate da Tauri/wry: servono solo per verificare il runtime WebView2 all'avvio.
webview2-com = "0.39.1"
windows-core = "0.62.2"

[dev-dependencies]
tempfile.workspace = true
