[package]
name = "pc-models"
description = "Modelli di photo-cat: manifest, verifica, download, runtime ONNX, self-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
specta = ["dep:specta"]
# Test che richiedono i modelli reali in assets/models.
model-tests = []

[dependencies]
specta = { workspace = true, optional = true }
pc-core.workspace = true
pc-jobs.workspace = true
pc-governor.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "directml", "ndarray", "std", "tracing", "api-24"] }
ndarray = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile.workspace = true
