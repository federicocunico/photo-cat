[package]
name = "pc-diag"
description = "Log su file, registro errori, panic hook e pacchetto diagnostico di photo-cat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
specta = ["dep:specta", "pc-core/specta"]

[dependencies]
specta = { workspace = true, optional = true }
pc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "json", "std"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde", "clock"] }
parking_lot = "0.12"
tempfile.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
