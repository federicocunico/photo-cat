[package]
name = "pc-diag"
description = "Log su file, registro errori, panic hook e pacchetto diagnostico di photo-cat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
specta = ["dep:specta", "pc-core/specta"]

[dependencies]
specta = { workspace = true, optional = true }
pc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "json", "std"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde", "clock"] }
parking_lot = "0.12"
tempfile.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }
libc = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
