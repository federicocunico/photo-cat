[package]
name = "pc-raw-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pc-core.workspace = true
pc-governor.workspace = true
pc-ingest.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
natord = "1"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff"] }
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_PortableDevices",
    "Win32_Devices_Properties",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
specta = ["dep:specta", "pc-core/specta"]
# Decodifica JPEG SIMD (richiede cmake e nasm): attiva nelle build di release Windows e macOS.
simd-jpeg = ["dep:turbojpeg"]
# Simulatore di fotocamera per test e demo, al posto della fotocamera reale.
fake-camera = []

[dev-dependencies]
tempfile.workspace = true
