name: Release

# Su tag `v<versione>` compila il setup Windows e pubblica una GitHub Release
# con l'installer EXE e il relativo checksum SHA-256.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verifica che il tag corrisponda alla versione dell'app
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $conf -or $tag -ne $cargo) {
            Write-Error "Tag v$tag diverso dalla versione dell'app (tauri.conf.json $conf, Cargo.toml $cargo)"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          save-if: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix app/ui
      - name: Compila setup NSIS
        run: npm --prefix app/ui run tauri -- build --ci --bundles nsis
      - name: Checksum SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "dist/$($exe.Name).sha256"
          Get-Content "dist/$($exe.Name).sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Unico job con permesso di scrittura: solo per creare la release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist
      - name: Crea GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "photo-cat ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
